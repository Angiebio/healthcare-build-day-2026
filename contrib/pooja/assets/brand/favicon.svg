<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Lantern">
  <!-- Square ground, because the mark has to read at 16px and a circle at that
       size just becomes a smudge. Navy body, orange flame: the same two colours
       as the logo, nothing else. -->
  <rect width="32" height="32" rx="2" fill="#22305c"/>

  <!-- top ring and cap -->
  <path d="M16 4.2v2.1" stroke="#f7921e" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M11.6 7.4h8.8l1.5 3.1H10.1z" fill="#ffffff"/>

  <!-- body -->
  <path d="M10.6 11.3h10.8l-1.5 12.2a1.3 1.3 0 0 1-1.3 1.1h-5.2a1.3 1.3 0 0 1-1.3-1.1z"
        fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- the flame, the one warm thing in the mark -->
  <path d="M16 14.2c-1.3 1.4-2 2.5-2 3.6a2 2 0 0 0 4 0c0-.7-.35-1.4-.8-2.1"
        fill="none" stroke="#f7921e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- base -->
  <path d="M11.9 25.6h8.2" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
</svg>
